name: Apply Ground Fix

on:
  push:
    branches:
      - fix/performance-flicker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/performance-flicker

      - name: Replace recycled strips with continuous TileSprite
        shell: python
        run: |
          from pathlib import Path

          path = Path('js/main.js')
          text = path.read_text(encoding='utf-8')

          old_create = """    this.groundStrips=Array.from({length:3},()=>this.add.image(0,GROUND-3,'terrain-0').setOrigin(0).setMask(groundMask));
              this.world.add(this.groundStrips);"""
          new_create = """    this.terrain=this.add.tileSprite(0,GROUND-3,1280,164,'terrain-0').setOrigin(0).setMask(groundMask);
              this.world.add(this.terrain);"""

          old_render = """    const groundOffset=g.track.distance%840;
              this.groundStrips.forEach((strip,i)=>{
                if(strip.texture.key!=='terrain-'+g.phaseIndex)strip.setTexture('terrain-'+g.phaseIndex);
                strip.setPosition(i*840-groundOffset,GROUND-3);
              });"""
          new_render = """    const terrainKey='terrain-'+g.phaseIndex;
              if(this.terrain.displayTexture.key!==terrainKey)this.terrain.setTexture(terrainKey);
              this.terrain.tilePositionX=g.track.distance;"""

          if old_create in text:
              text = text.replace(old_create, new_create, 1)
          elif new_create not in text:
              raise SystemExit('ground creation block not found')

          if old_render in text:
              text = text.replace(old_render, new_render, 1)
          elif new_render not in text:
              raise SystemExit('ground render block not found')

          path.write_text(text, encoding='utf-8')

      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet -- js/main.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js
          git commit -m "fix: render terrain as continuous tile"
          git push origin HEAD:fix/performance-flicker
