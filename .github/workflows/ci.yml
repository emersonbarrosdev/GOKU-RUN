name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Use npm 11
        run: npm install --global npm@11.21.1

      - name: Regenerate cross-platform lockfile
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already stable"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: stabilize npm lockfile across platforms"
            git push
          fi

      - name: Gate A - Logic and physics
        run: npm ci && npm test

      - name: Gate B - Production build
        run: npm run build

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Start production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/goku-run-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/goku-run-preview.log
          exit 1

      - name: Gate C - Story and navigation
        env:
          TEST_URL: http://127.0.0.1:4173/
        run: npm run test:story

      - name: Gate D - Sprite and animation render contract
        env:
          TEST_URL: http://127.0.0.1:4173/
        run: npm run test:render

      - name: Gate E - Terrain continuity and flicker
        env:
          TEST_URL: http://127.0.0.1:4173/
        run: npm run test:visual

      - name: Gate F - Mobile smoke
        env:
          TEST_URL: http://127.0.0.1:4173/
        run: npm run test:mobile
