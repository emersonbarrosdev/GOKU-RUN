name: CI

on:
  push:
    branches:
      - main
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Start preview server
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/goku-run-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/goku-run-preview.log
          exit 1

      - name: Run visual regression audit
        env:
          TEST_URL: http://127.0.0.1:4173/
        run: npm run test:visual

      - name: Run mobile smoke test
        env:
          TEST_URL: http://127.0.0.1:4173/
        run: npm run test:mobile
